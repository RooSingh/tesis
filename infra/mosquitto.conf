# This is a Mosquitto configuration file that creates a listener on port 1883
# that allows unauthenticated access.

# Global: debe ir ANTES de cualquier listener. Una opcion global escrita
# despues de un listener queda asociada a ese listener y no rige para el
# servicio, y el intermediario no avisa: recarga sin error y no cambia nada.
max_inflight_messages 100
# Cuantos mensajes con garantia retiene el intermediario para un suscriptor
# **ausente**, con la sesion conservada.
#
# El valor por omision es 1000, y se lo destapo midiendo: matando al consumidor
# con tres mil mensajes encolados, volvieron 1.300 ---las cien ya escritas, las
# cien en vuelo y unas mil de la cola--- y **mil setecientas se descartaron sin
# aviso**.
#
# Es el mismo defecto que el descarte del publicador: un tope con valor por
# omision que descarta en silencio. La sesion conservada y la confirmacion manual
# protegen **hasta la profundidad de esta cola**, no mas alla.
#
# El costo es memoria del intermediario: la cola vive alli. Cien mil mensajes de
# unos trescientos bytes son unos treinta megabytes por suscriptor ausente, que
# es aceptable para este trabajo y no lo seria sin acotar.
max_queued_messages 100000


listener 1883
allow_anonymous true

listener 9883
protocol http_api
http_dir /usr/share/mosquitto/dashboard

# --------------------------------------------------------------------------
# Cuantos mensajes con garantia de entrega manda el intermediario a un mismo
# suscriptor sin que se le confirmen.
#
# El valor por omision es 20, y se lo midio: un suscriptor con confirmacion
# manual que no confirma nada recibe exactamente veinte y despues la entrega se
# detiene hasta que lleguen los acuses.
#
# Veinte es poco para la confirmacion manual del consumidor. Con ella el acuse
# sale despues de escribir en la base, y los acuses salen de a lotes cada medio
# segundo, de modo que el techo queda en 20 / 0,5 = 40 mensajes por segundo. El
# modo en vivo produce 77,2 medidos: no alcanzaria.
#
# Con cien el techo pasa a 200 y el margen es de mas del doble. La alternativa
# ---bajar el vencimiento del lote--- costaria partir los lotes de 644 a 322
# filas, es decir el doble de idas a la base para el mismo dato.
