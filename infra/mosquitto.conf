# This is a Mosquitto configuration file that creates a listener on port 1883
# that allows unauthenticated access.

# Global: debe ir ANTES de cualquier listener. Una opcion global escrita
# despues de un listener queda asociada a ese listener y no rige para el
# servicio, y el intermediario no avisa: recarga sin error y no cambia nada.
max_inflight_messages 100
# Cuantos mensajes con garantia retiene el intermediario para un suscriptor
# **ausente**, con la sesion conservada.
#
# El valor por omision es 1000, y se lo destapo midiendo: matando al consumidor
# con tres mil mensajes encolados, volvieron 1.300 ---las cien ya escritas, las
# cien en vuelo y unas mil de la cola--- y **mil setecientas se descartaron sin
# aviso**.
#
# Es el mismo defecto que el descarte del publicador: un tope con valor por
# omision que descarta en silencio. La sesion conservada y la confirmacion manual
# protegen **hasta la profundidad de esta cola**, no mas alla.
#
# El costo es memoria del intermediario: la cola vive alli.
#
# ESTE TOPE SOLO NO ALCANZA, Y LA CUENTA DE ABAJO QUEDO VIEJA.
# Cuando se escribio decia que cien mil mensajes de unos trescientos bytes son
# unos treinta megabytes, y era cierto **ese dia**. La misma jornada, y por otro
# motivo, el publicador paso a agrupar un envio por paquete de juego en lugar de
# uno por senal: cada mensaje pasa a pesar hasta **quinientas sesenta veces mas**.
#
# Ninguna de las dos decisiones previo a la otra, y el producto es el techo real
# de esta cola. Medido bajo la parrilla de veinte: el intermediario recibio
# 5.860 MB y entrego 874, y **llego a 4.645 MB de memoria**, que no es cache sino
# memoria anonima del proceso.
max_queued_messages 100000
# El techo en la unidad correcta, por cliente.
#
# El problema nunca fue cuantos mensajes hay en cola sino cuanto pesa cada uno,
# y esta opcion es la que lo expresa. Rige junto con la de arriba: la
# documentacion del intermediario declara que con las dos puestas «packets will
# be queued until the first limit is reached».
#
# POR QUE NO `memory_limit`, QUE ERA LA PRIMERA IDEA. Esa opcion declara que al
# superarse el techo «the message will be dropped **and the publishing client
# will be disconnected**»: desconectaria al capturador en medio de una sesion, y
# ademas romperia las garantias que este trabajo midio ---sesion conservada,
# confirmacion manual, tiempo de recuperacion---, que suponen todas que el
# cliente sigue conectado. Esta opcion, en cambio, descarta en silencio, que es
# **el mismo modo de fallo que ya tiene el tope de arriba**.
#
# De donde sale el valor. Medido: bajo la parrilla completa entran 34 MB/s; en la
# configuracion de operacion ---solo el vehiculo propio en vivo, 1.776 senales por
# segundo contra 35.186--- son unos 1,7 MB/s. Cien megabytes cubren cerca de un
# minuto de corte del consumidor, que es la pregunta que fija el numero.
#
# El descarte sigue siendo silencioso, y corresponde decirlo: ni el codigo de
# retorno del publicador ni los contadores del consumidor lo ven, porque ocurre
# del lado de salida. Se detecta reconciliando lo publicado contra lo persistido,
# que es lo que las pruebas ya hacen.
max_queued_bytes 104857600


listener 1883
allow_anonymous true

listener 9883
protocol http_api
http_dir /usr/share/mosquitto/dashboard

# --------------------------------------------------------------------------
# Cuantos mensajes con garantia de entrega manda el intermediario a un mismo
# suscriptor sin que se le confirmen.
#
# El valor por omision es 20, y se lo midio: un suscriptor con confirmacion
# manual que no confirma nada recibe exactamente veinte y despues la entrega se
# detiene hasta que lleguen los acuses.
#
# Veinte es poco para la confirmacion manual del consumidor. Con ella el acuse
# sale despues de escribir en la base, y los acuses salen de a lotes cada medio
# segundo, de modo que el techo queda en 20 / 0,5 = 40 mensajes por segundo. El
# modo en vivo produce 77,2 medidos: no alcanzaria.
#
# Con cien el techo pasa a 200 y el margen es de mas del doble. La alternativa
# ---bajar el vencimiento del lote--- costaria partir los lotes de 644 a 322
# filas, es decir el doble de idas a la base para el mismo dato.
