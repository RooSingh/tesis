# Definicion reproducible del intermediario de mensajeria.
#
# POR QUE EXISTE
# --------------
# El contenedor se habia creado con `docker run`, de modo que **su configuracion
# vivia adentro del contenedor**. Recrearlo por cualquier motivo ---una
# actualizacion, un incidente del disco, un `docker rm`--- devolvia dos topes a su
# valor por omision, y los dos descartan telemetria en silencio:
#
#   max_inflight_messages   cuantos mensajes con garantia entrega sin que se los
#                           confirmen. Con la confirmacion manual fija el techo de
#                           caudal: veinte dejaban cuarenta mensajes por segundo
#                           contra los 77,2 que el modo en vivo necesita.
#   max_queued_messages     cuantos retiene para un suscriptor ausente. Es hasta
#                           donde protege la sesion conservada: con mil, matar al
#                           consumidor con tres mil encolados perdia 1.700.
#
# Montando la configuracion desde el repositorio, el ajuste **viaja con el codigo**
# y sobrevive a recrear el contenedor.
#
# LA BASE DE DATOS AHORA TAMBIEN, Y HUBO QUE CORREGIR UNA AFIRMACION
# ------------------------------------------------------------------
# Este archivo decia que la base se quedaba afuera porque sus datos vivian «en un
# volumen con nombre» y sobrevivian a recrear el contenedor. **Eso era falso.**
# Comprobado el 2026-09-08 con `docker inspect`: el volumen es anonimo, se llama
# `70960a174506d1...`, y un `docker rm -v` se lleva las filas sin preguntar. La
# afirmacion que justificaba dejarla afuera era justamente el motivo para traerla.
#
# El otro motivo aparecio al preguntarse que hace falta para levantar el trabajo
# en otra computadora: sin esto, no hay de donde sacar ni la version de la imagen
# ni el ajuste de PostgreSQL, que no estaba en ningun archivo del repositorio.
#
# EL CONTENEDOR QUE YA EXISTE NO SE TOCA
# --------------------------------------
# En la maquina donde la base ya corre, `up -d` **no la migra**: Docker se niega a
# crear un contenedor con un nombre en uso y no pasa nada. Mover los datos del
# volumen anonimo al nombrado es una operacion aparte, deliberada, y no la hace
# este archivo.
#
# COMO SE USA
# -----------
#   docker compose -f infra/docker-compose.yml up -d
#
# Y despues, siempre:
#   python scripts/verificar_topes_intermediario.py
#
# En una maquina nueva, ademas, las migraciones en orden:
#   for f in database/*.sql; do python scripts/apply_database_migration.py $f; done
#
# Ese guion no lee la configuracion sino que **mide la conducta**, que es lo unico
# que distingue un ajuste aplicado de uno leido y descartado. Estos topes no se
# aplican en una recarga, y la recarga informa exito igual.

services:
  mosquitto:
    # Version fija y no `latest`. La imagen que corria era `latest`, y `latest`
    # es justamente lo que puede cambiar de version ---y de valores por
    # omision--- sin que nadie lo pida. La etiqueta apunta a la imagen que ya
    # estaba en la maquina, de modo que recrear no descarga nada.
    #
    # EL SUFIJO `-alpine` NO ES UNA VARIANTE ELEGIDA: es la unica forma en que
    # esa version esta publicada. `eclipse-mosquitto:2.1.2` **no existe en el
    # registro** ---la serie 2.1 se publica solo como `2.1.x-alpine`--- y con esa
    # etiqueta `up -d` falla en una maquina nueva con `manifest unknown`. En la
    # maquina de origen no se noto porque la imagen ya estaba descargada. Que es
    # exactamente la misma quedo comprobado el 2026-09-08: el manifiesto de
    # `latest` ---la etiqueta con la que se habia descargado--- y el de
    # `2.1.2-alpine` son identicos byte a byte.
    image: eclipse-mosquitto:2.1.2-alpine
    container_name: tesis-mosquitto
    # DESDE EL ENTORNO, CON `no` POR OMISION.
    #
    # `no` reproduce la conducta que el contenedor tenia en la maquina de
    # trabajo, y ahi sigue siendo lo correcto: una jornada hubo un reinicio de
    # Docker y que los contenedores quedaran abajo fue informacion, no un
    # estorbo.
    #
    # En una maquina desatendida es al reves. Una Raspberry que se cuelga de la
    # corriente vuelve sola, y si los contenedores no vuelven con ella el
    # sistema queda caido sin que nadie se entere. Ahi se pone
    # `unless-stopped`, en el `.env` de esta carpeta.
    restart: ${DOCKER_REINICIO:-no}
    ports:
      # Solo el 1883. El listener del panel en 9883 existe en la configuracion y
      # **no estaba publicado al anfitrion**; se reproduce tal cual para no
      # exponer nada que antes no lo estuviera.
      #
      # LA INTERFAZ TAMBIEN SALE DEL ENTORNO, y por omision es la de siempre.
      # Docker publica en todas las interfaces si no se le dice otra cosa, de
      # modo que en una maquina conectada a una red domestica el intermediario
      # queda escuchando en ella: cualquiera puede publicar telemetria falsa o
      # suscribirse a la real, porque no pide credenciales. En un despliegue se
      # pone `127.0.0.1`, que es de donde se conectan el consumidor y el
      # capturador, los dos en la misma maquina.
      - "${BIND_ANFITRION:-0.0.0.0}:1883:1883"
    volumes:
      # La configuracion, de solo lectura: el contenedor no debe poder cambiar lo
      # que el repositorio declara.
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    # QUE «ARRANCADO» SIGNIFIQUE «CONTESTA».
    #
    # Sin esto, lo unico que se puede esperar es que el contenedor exista, y un
    # contenedor existe desde antes de aceptar una conexion. Esa ventana es la
    # que produjo el defecto que `DESPLIEGUE.md` documenta: el servicio web
    # arrancaba antes que el intermediario, la conexion fallaba, y como no
    # reintenta el sistema quedaba **vivo y con el flujo muerto**, sin avisar.
    #
    # Se pregunta suscribiendose de verdad a las estadisticas del propio
    # intermediario: un puerto abierto no prueba que el servicio conteste.
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -p 1883 -t '$$SYS/broker/version' -C 1 -W 2 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  timescaledb:
    # La misma que corre hoy: PostgreSQL 16.14 con TimescaleDB 2.28.3.
    #
    # `latest-pg16` es una etiqueta movil, igual que `latest`, y este archivo ya
    # explica arriba por que eso no sirve. Se fija por digesto, que es lo unico
    # que no puede cambiar debajo: apunta a la imagen que esta en la maquina, de
    # modo que en esta no se descarga nada y en otra se descarga exactamente esa.
    image: timescale/timescaledb@sha256:61f891691050da6032023c01ea885730eeeba06b7c17b403e7d0b9c49c37dfe9
    container_name: tesis-timescaledb
    # Lo mismo que arriba, y con mas motivo: aca vive lo que no se puede perder.
    restart: ${DOCKER_REINICIO:-no}
    environment:
      # Las mismas credenciales que `backend/config.py` tiene por omision. Son
      # locales y estan en el codigo desde el principio: no son un secreto que
      # este archivo revele, son la configuracion de un servicio que solo
      # escucha en esta maquina.
      #
      # Salen del entorno con esos mismos valores por omision. Existe para poder
      # poner otra contrasena donde la maquina aloja algo mas, sin editar un
      # archivo versionado. **Solo tienen efecto cuando el volumen se crea**:
      # PostgreSQL las usa al inicializar la base y despues las ignora, de modo
      # que cambiarlas sobre un volumen que ya existe no cambia nada y da la
      # falsa impresion de haber cambiado algo.
      POSTGRES_USER: ${DB_USER:-tesis_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tesis_pass}
      POSTGRES_DB: ${DB_NAME:-tesis_db}
    ports:
      # EL PUERTO DEL ANFITRION SALE DEL ENTORNO, con 5432 por omision: en la
      # maquina de origen no cambia nada. Existe porque 5432 es el puerto por
      # omision de PostgreSQL y por eso mismo suele estar tomado por otra cosa
      # en una computadora que ya corre otros trabajos; ahi `up -d` falla con
      # `port is already allocated` y la unica salida honesta es publicar en
      # otro puerto, no bajar la base ajena.
      #
      # Quien lo cambie tiene que exportar **tambien** `DB_PORT` con el mismo
      # valor, porque es de donde `backend/config.py` lo lee. Adentro del
      # contenedor sigue siendo 5432 siempre.
      - "${BIND_ANFITRION:-0.0.0.0}:${DB_PUERTO_ANFITRION:-5432}:5432"
    volumes:
      # NOMBRADO, no anonimo. Es la diferencia entre que `docker rm` se lleve la
      # base o no.
      - timescaledb_data:/var/lib/postgresql/data
    # EL AJUSTE, EN EL REPOSITORIO Y NO ADENTRO DEL VOLUMEN.
    #
    # Estos valores los produjo `timescaledb-tune` la primera vez que el
    # contenedor arranco, y quedaron en un `postgresql.conf` **dentro del
    # volumen**: no habia forma de saber cuales eran sin entrar a preguntarle a
    # la base. Pasados como argumentos quedan escritos, y ademas ganan sobre el
    # archivo, de modo que lo que dice el repositorio es lo que corre.
    #
    # ESTAN DIMENSIONADOS PARA ESTA MAQUINA, de 8 GB de memoria. En una con otra
    # cantidad hay que rehacerlos ---`timescaledb-tune` los recalcula--- y
    # anotarlos aca. Dejarlos como estan en una maquina mas chica hace que
    # PostgreSQL no arranque.
    command:
      - postgres
      - -c
      - shared_preload_libraries=timescaledb
      - -c
      - shared_buffers=1713MB
      - -c
      - effective_cache_size=5139MB
      - -c
      - maintenance_work_mem=877080kB
      - -c
      - work_mem=3426kB
      - -c
      - wal_buffers=16MB
      - -c
      - min_wal_size=512MB
      - -c
      - max_wal_size=1024MB
      - -c
      - checkpoint_completion_target=0.9
      # Disco de estado solido: un salto no cuesta mucho mas que una lectura
      # secuencial, y con el valor de fabrica ---4--- el planificador prefiere
      # recorrer la tabla antes que usar un indice.
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=256
      - -c
      - max_worker_processes=35
      - -c
      - max_parallel_workers=16
      - -c
      - max_parallel_workers_per_gather=8
      - -c
      - timescaledb.max_background_workers=16
      - -c
      - autovacuum_max_workers=10
      - -c
      - autovacuum_naptime=10
      - -c
      - max_locks_per_transaction=128
      # La compilacion al vuelo cuesta mas de lo que ahorra en consultas que ya
      # estan resueltas por indice y por fragmento.
      - -c
      - jit=off
      - -c
      - default_toast_compression=lz4
      - -c
      - timezone=UTC
    # La base tarda mas que el intermediario en estar lista: carga la extension
    # y recupera el registro de escritura si el ultimo apagado fue sucio ---que
    # es justo el caso del corte de corriente que se probo el 2026-09-12---. Se
    # le da un margen de arranque generoso y despues se pregunta seguido.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-tesis_user} -d $${POSTGRES_DB:-tesis_db} -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s

  # ==========================================================================
  # LA APLICACION, EN CONTENEDOR
  # --------------------------------------------------------------------------
  # POR QUE ESTAS TRES ESTAN BAJO UN PERFIL Y LAS DE ARRIBA NO.
  #
  # Hasta hoy el reparto era: la infraestructura en contenedor y la aplicacion
  # sobre el anfitrion, en unidades de systemd. Eso funciona y esta medido ---el
  # 2026-09-12 la Raspberry volvio sola de un corte de corriente en 58
  # segundos---, de modo que reemplazarlo de golpe seria cambiar algo que anda
  # por algo que todavia no se probo en esa maquina.
  #
  # Con `profiles`, estos tres **no arrancan** con un `docker compose up -d`
  # normal: hay que pedirlos. El despliegue de hoy sigue comportandose igual
  # hasta que alguien decida cambiarlo, y volver atras es dejar de pedirlos.
  #
  # QUE SE GANA AL MOVERLOS AQUI, y es una sola cosa que vale por si sola: hoy
  # hay **dos planificadores** ---systemd para la aplicacion, Docker para la
  # infraestructura--- y ninguno sabe del otro. De ahi salio el defecto que
  # `DESPLIEGUE.md` documenta: en un arranque en frio las unidades le ganan la
  # carrera a los contenedores, la conexion al intermediario no reintenta, y el
  # servicio queda activo respondiendo la consulta de estado con el flujo en
  # vivo muerto. Hoy eso se evita con una espera escrita a mano en cada unidad,
  # que cuenta hasta noventa preguntando por dos puertos. Aqui lo evita
  # `depends_on ... service_healthy`, que no es una espera sino una condicion:
  # el contenedor **no arranca** hasta que los otros dos contestan.
  #
  # LAS DIRECCIONES DEJAN DE SER `127.0.0.1`. Adentro de la red del compose cada
  # servicio se llama por su nombre y usa su puerto interno, de modo que la
  # aplicacion ya no depende de en que puerto del anfitrion se publico la base.
  # `DB_PUERTO_ANFITRION` sigue existiendo para quien se conecte desde afuera.

  api:
    profiles: ["completo"]
    build:
      context: ..
      dockerfile: infra/Dockerfile
    image: tesis-app:local
    container_name: tesis-api
    restart: ${DOCKER_REINICIO:-no}
    depends_on:
      timescaledb:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    environment:
      # Por nombre de servicio y puerto interno: ver el comentario de arriba.
      DB_HOST: timescaledb
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-tesis_db}
      DB_USER: ${DB_USER:-tesis_user}
      # HACE FALTA UNA CONTRASENA DE VERDAD, Y LA GUARDA ESTA EN EL CODIGO.
      #
      # `backend/config.py:182` se niega a arrancar si la base no es local y la
      # contrasena es la que el repositorio publica. En contenedor la base
      # **nunca** es local: se la alcanza por nombre de servicio sobre una red
      # compartida, que es justo el caso que esa guarda describe ---«una base
      # alcanzable desde fuera de esta maquina, con la clave que cualquiera
      # puede leer en el repositorio»---.
      #
      # Comprobado el 2026-09-12 corriendo la imagen: sin definirla, el servicio
      # arranca y muere en el evento de inicio, con el motivo escrito.
      #
      # NO SE REPITE LA GUARDA AQUI. Se probo con `${DB_PASSWORD:?...}` y tiene
      # un defecto: el compose interpola **todo el archivo** antes de mirar los
      # perfiles, de modo que exigirla rompia tambien el modo de hoy, que no
      # levanta estos servicios. Y ademas serian dos guardas que hay que
      # mantener de acuerdo. Una sola, en el lugar que sabe por que.
      DB_PASSWORD: ${DB_PASSWORD:-tesis_pass}
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      # El servicio web sirve tambien el tablero. No es comodidad: es lo que
      # evita a la vez el control de origen cruzado y una segunda cookie del
      # portal de acceso. Ver la seccion «Un solo origen» de `DESPLIEGUE.md`.
      SERVIR_TABLERO: 1
    # ADENTRO ESCUCHA EN TODAS LAS INTERFACES, Y AFUERA SOLO EN LA LOCAL.
    #
    # La unidad de systemd ataba el proceso a `127.0.0.1`. Un contenedor que se
    # ate a su propio `127.0.0.1` no es alcanzable ni siquiera desde el
    # anfitrion, de modo que el proceso escucha en `0.0.0.0` **de su red
    # privada** y quien decide desde donde se llega es la publicacion de abajo.
    # La propiedad que importa ---que no quede expuesto a la red de casa--- la
    # sigue dando `BIND_ANFITRION`, no la direccion del proceso.
    command:
      - python
      - -m
      - uvicorn
      - backend.app:app
      - --host
      - 0.0.0.0
      - --port
      - "8080"
    ports:
      - "${BIND_ANFITRION:-127.0.0.1}:${API_PUERTO_ANFITRION:-8080}:8080"
    volumes:
      # De solo lectura: el servicio web lee capturas para declarar procedencia
      # y no tiene por que poder cambiarlas.
      - ../datasets:/app/datasets:ro
      - ../logs:/app/logs

  consumidor:
    profiles: ["completo"]
    build:
      context: ..
      dockerfile: infra/Dockerfile
    image: tesis-app:local
    container_name: tesis-consumidor
    restart: ${DOCKER_REINICIO:-no}
    depends_on:
      timescaledb:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    environment:
      DB_HOST: timescaledb
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-tesis_db}
      DB_USER: ${DB_USER:-tesis_user}
      # HACE FALTA UNA CONTRASENA DE VERDAD, Y LA GUARDA ESTA EN EL CODIGO.
      #
      # `backend/config.py:182` se niega a arrancar si la base no es local y la
      # contrasena es la que el repositorio publica. En contenedor la base
      # **nunca** es local: se la alcanza por nombre de servicio sobre una red
      # compartida, que es justo el caso que esa guarda describe ---«una base
      # alcanzable desde fuera de esta maquina, con la clave que cualquiera
      # puede leer en el repositorio»---.
      #
      # Comprobado el 2026-09-12 corriendo la imagen: sin definirla, el servicio
      # arranca y muere en el evento de inicio, con el motivo escrito.
      #
      # NO SE REPITE LA GUARDA AQUI. Se probo con `${DB_PASSWORD:?...}` y tiene
      # un defecto: el compose interpola **todo el archivo** antes de mirar los
      # perfiles, de modo que exigirla rompia tambien el modo de hoy, que no
      # levanta estos servicios. Y ademas serian dos guardas que hay que
      # mantener de acuerdo. Una sola, en el lugar que sabe por que.
      DB_PASSWORD: ${DB_PASSWORD:-tesis_pass}
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      # El valor que la Raspberry ya tiene puesto por un agregado de systemd.
      # Estaba declarado dos veces y en conflicto ---1000 en el archivo de
      # entorno y 5000 en el agregado---; aca queda una sola vez.
      MQTT_BATCH_SIZE: ${MQTT_BATCH_SIZE:-5000}
    command:
      - python
      - scripts/run_mqtt_consumer.py
      - --metrics-file
      - logs/consumidor_metricas.json
      - --metrics-history-file
      - logs/consumidor_historial.jsonl
    volumes:
      - ../logs:/app/logs

  capturador:
    # PERFIL PROPIO, Y NO EL DE LA APLICACION.
    #
    # El capturador no es un servicio permanente: escucha una consola que la
    # mayor parte del tiempo no esta jugando. Su unidad de systemd lo dice ---
    # `Restart=no`, «si nadie esta jugando no hay nada que capturar»--- y esa
    # decision se conserva aqui con un perfil aparte, de modo que `--profile
    # completo` levanta el sistema y `--profile captura` agrega la escucha.
    #
    # El 2026-09-12 se midio el costo de esa decision: tras un corte de
    # corriente el sistema vuelve entero y **sordo**, y el tablero mostraba
    # valores congelados sin decir que lo estaban. Lo segundo ya se arreglo; lo
    # primero sigue siendo a proposito.
    profiles: ["captura"]
    build:
      context: ..
      dockerfile: infra/Dockerfile
    image: tesis-app:local
    container_name: tesis-capturador
    # `no`, igual que la unidad: un capturador que se rearranca solo vuelve a
    # abrir el puerto y pelea con el que lo lanzo desde el tablero.
    restart: "no"
    depends_on:
      timescaledb:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    environment:
      DB_HOST: timescaledb
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-tesis_db}
      DB_USER: ${DB_USER:-tesis_user}
      # HACE FALTA UNA CONTRASENA DE VERDAD, Y LA GUARDA ESTA EN EL CODIGO.
      #
      # `backend/config.py:182` se niega a arrancar si la base no es local y la
      # contrasena es la que el repositorio publica. En contenedor la base
      # **nunca** es local: se la alcanza por nombre de servicio sobre una red
      # compartida, que es justo el caso que esa guarda describe ---«una base
      # alcanzable desde fuera de esta maquina, con la clave que cualquiera
      # puede leer en el repositorio»---.
      #
      # Comprobado el 2026-09-12 corriendo la imagen: sin definirla, el servicio
      # arranca y muere en el evento de inicio, con el motivo escrito.
      #
      # NO SE REPITE LA GUARDA AQUI. Se probo con `${DB_PASSWORD:?...}` y tiene
      # un defecto: el compose interpola **todo el archivo** antes de mirar los
      # perfiles, de modo que exigirla rompia tambien el modo de hoy, que no
      # levanta estos servicios. Y ademas serian dos guardas que hay que
      # mantener de acuerdo. Una sola, en el lugar que sabe por que.
      DB_PASSWORD: ${DB_PASSWORD:-tesis_pass}
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      CAPTURA_SOLO_VEHICULO_PROPIO: ${CAPTURA_SOLO_VEHICULO_PROPIO:-1}
    command: ["python", "scripts/capturar_f1_25.py"]
    # EL PUERTO DEL JUEGO SE PUBLICA, NO SE USA LA RED DEL ANFITRION.
    #
    # `network_mode: host` tambien funcionaria en Linux, y ademas dejaria al
    # contenedor fuera de la red del compose: tendria que volver a hablarle a la
    # base por `127.0.0.1` y un puerto publicado, que es lo que se estaba
    # sacando. Publicar el puerto lo deja adentro.
    #
    # La traduccion de direcciones no molesta porque el capturador **descarta la
    # direccion de origen**: `datos, _ = sock.recvfrom(4096)`. Si algun dia la
    # usara, esto habria que revisarlo.
    ports:
      - "${BIND_CAPTURA:-0.0.0.0}:20777:20777/udp"
    volumes:
      # De escritura: aqui se graban las capturas crudas y sus metadatos.
      - ../datasets:/app/datasets
      - ../logs:/app/logs

volumes:
  # Nombrados en lugar de anonimos. Los anteriores eran anonimos y quedan
  # huerfanos al recrear: no se pierde nada porque la persistencia en disco no
  # esta habilitada y la cola del intermediario vive en memoria, cosa que ya se
  # sabia por haberla perdido en un reinicio.
  mosquitto_data:
  mosquitto_log:
  # El de la base **si** guarda algo que no se puede perder. El contenedor que
  # corre hoy usa uno anonimo; este no lo reemplaza ni lo toca.
  timescaledb_data:
